<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#29331e">
<title>Reset password | Adelaide Wellness &amp; Spa</title>
<link rel="icon" type="image/png" href="assets/images/logo/Elegant%20Golden%20A%20Spa%20Emblem.png">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/admin-auth.css">
<meta name="referrer" content="same-origin"><script src="js/spa-api.js" defer></script><script src="js/admin-auth.js" defer></script>
<link rel="stylesheet" href="css/loader.css">
<script src="js/loader.js"></script>
</head>
<body class="auth-page">
<!-- ADELAIDE WELLNESS SPA LOADER -->
<div id="page-loader" class="page-loader" role="status" aria-live="polite"><div class="loader-wrap"><div class="loader-ring"><div class="spa-mark" aria-hidden="true"><span class="leaf leaf-left"></span><span class="leaf leaf-center"></span><span class="leaf leaf-right"></span></div></div></div><span class="loader-status">Loading Adelaide Wellness &amp; Spa…</span></div>

<a class="skip-link" href="#main">Skip to form</a>
<main id="main" class="page-main auth-shell">
<section class="auth-content" aria-labelledby="auth-title">
<div class="auth-card">
<a class="auth-brand" href="index.html" aria-label="Adelaide Wellness and Spa home"><img src="assets/images/logo/Adelaide%20Wellness%20Spa%20Emblem.png" alt="Adelaide Wellness &amp; Spa" width="180" height="120"></a>
<h1 id="auth-title">Reset password</h1>
<p class="auth-intro">Choose a new password for your staff account.</p>
<form class="auth-form" data-auth-mode="reset">
<div class="form-field">
<label for="password">New password</label>
<div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span><input id="password" name="password" type="password" placeholder="Create a new password" autocomplete="new-password" required maxlength="128" minlength="12" aria-describedby="password-hint"><button class="password-toggle" type="button" aria-controls="password" aria-label="Show new password" aria-pressed="false"><span class="visibility-icon" aria-hidden="true"></span></button></div>
<p id="password-hint" class="field-hint">Use at least 12 characters.</p>
</div>
<div class="form-field">
<label for="confirm-password">Confirm new password</label>
<div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span><input id="confirm-password" name="confirm-password" type="password" placeholder="Re-enter your new password" autocomplete="new-password" required maxlength="128" ><button class="password-toggle" type="button" aria-controls="confirm-password" aria-label="Show confirm new password" aria-pressed="false"><span class="visibility-icon" aria-hidden="true"></span></button></div>

</div>
<p class="access-note">Open this page using your password reset email link.</p>
<button class="button button-dark auth-submit" type="submit" disabled>Save new password<span aria-hidden="true">&rarr;</span></button>
<p class="form-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden></p>
</form>
<noscript><p class="access-note">Enable JavaScript to use secure staff sign-in.</p></noscript>
<p class="auth-switch">Need a new reset link? <a href="admin-forgot-password.html">Request one</a></p>
</div>
</section>
</main>
</body>
</html>
